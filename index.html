<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi novia Hermosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#d8f0d2; --bg2:#fbe3ea; --bg3:#cfeadf;
  --bark:#8a5a3c; --bark-d:#6e4529; --leaf:#5fa85a; --leaf-l:#8ccf7e;
  --heart:#e0243f; --blush:#ff9fb2; --ink:#9b2c4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#1f3a2c; --bg2:#4a2433; --bg3:#26443a; --ink:#ffb3c6; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  min-height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-size:200% 200%;
  animation:drift 18s ease-in-out infinite alternate;
  font-family:'Quicksand',system-ui,sans-serif;
  overflow-x:hidden;
}
@keyframes drift{to{background-position:100% 100%}}
main{
  width:100%;max-width:640px;padding:24px 20px 40px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.scene{width:min(78vw,420px);opacity:0;animation:fadein 1.6s ease .2s forwards}
.scene svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes fadein{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite 1.8s}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.1)}70%{transform:scale(1)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
h1{
  font-family:'Great Vibes',cursive;font-weight:400;
  font-size:clamp(3.4rem,13vw,6.2rem);line-height:1.05;
  color:var(--ink);margin:.2em 0 0;
  text-shadow:0 2px 14px rgba(255,255,255,.5);
  opacity:0;animation:fadein 1.6s ease 1.1s forwards;
}
.sub{color:var(--ink);opacity:0;margin:.4em 0 0;font-size:1.05rem;animation:fadeonly 1.6s ease 1.8s forwards}
@keyframes fadeonly{to{opacity:.75}}
.float{position:fixed;bottom:-30px;pointer-events:none;color:var(--heart);opacity:.5;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .scene,h1{opacity:1}.sub{opacity:.75}
}
</style>
</head>
<body>
<main>
  <div class="scene" role="img" aria-label="Un arbolito sonriente entrega un corazón rojo con ambas manos">
    <svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="200" cy="396" rx="95" ry="12" fill="#000" opacity=".12"/>
      <g class="sway">
        <!-- ramitas y hojas -->
        <path d="M200 120 C198 90 190 75 176 62" stroke="var(--bark)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M200 120 C204 92 214 78 228 68" stroke="var(--bark)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="170" cy="56" rx="22" ry="12" fill="var(--leaf)" transform="rotate(-35 170 56)"/>
        <ellipse cx="236" cy="62" rx="24" ry="13" fill="var(--leaf-l)" transform="rotate(30 236 62)"/>
        <ellipse cx="203" cy="40" rx="20" ry="11" fill="var(--leaf)" transform="rotate(-80 203 40)"/>
        <!-- cuerpo -->
        <path d="M140 392 C130 330 140 270 160 235 L240 235 C262 270 272 330 262 392 Z" fill="var(--bark)"/>
        <path d="M185 392 C183 340 186 300 192 262" stroke="var(--bark-d)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
        <path d="M225 380 C228 340 226 310 220 285" stroke="var(--bark-d)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>
        <!-- cabeza -->
        <ellipse cx="200" cy="175" rx="80" ry="72" fill="var(--bark)"/>
        <ellipse cx="170" cy="140" rx="30" ry="18" fill="#a97452" opacity=".55"/>
        <!-- mejillas -->
        <ellipse cx="148" cy="195" rx="16" ry="10" fill="var(--blush)" opacity=".85"/>
        <ellipse cx="252" cy="195" rx="16" ry="10" fill="var(--blush)" opacity=".85"/>
        <!-- ojos -->
        <g class="blink"><ellipse cx="168" cy="172" rx="15" ry="18" fill="#2b1a12"/><circle cx="173" cy="165" r="6" fill="#fff"/><circle cx="163" cy="179" r="2.5" fill="#fff"/></g>
        <g class="blink"><ellipse cx="232" cy="172" rx="15" ry="18" fill="#2b1a12"/><circle cx="237" cy="165" r="6" fill="#fff"/><circle cx="227" cy="179" r="2.5" fill="#fff"/></g>
        <!-- sonrisa -->
        <path d="M184 205 Q200 222 216 205" stroke="#2b1a12" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- brazos -->
        <path d="M152 270 C128 290 135 320 168 322" stroke="var(--bark)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M248 270 C272 290 265 320 232 322" stroke="var(--bark)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <!-- corazón -->
        <g class="heart">
          <path d="M200 372 C150 335 150 288 180 288 C192 288 200 296 200 304 C200 296 208 288 220 288 C250 288 250 335 200 372 Z" fill="var(--heart)"/>
          <path d="M172 300 C176 294 184 294 188 299" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
        </g>
        <!-- manitas sosteniendo el corazón -->
        <circle cx="168" cy="322" r="11" fill="var(--bark)"/>
        <circle cx="232" cy="322" r="11" fill="var(--bark)"/>
      </g>
    </svg>
  </div>
  <h1>La quiero mucho Mi Davi, Mi novia, Mi amor ❤️</h1>
  <p class="sub">Mi corazón, amor y mi cariño le pertenecen a usted</p>
</main>
<script>
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var n=0;
  var t=setInterval(function(){
    var s=document.createElement('span');
    s.className='float';
    s.textContent='❤';
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(12+Math.random()*18)+'px';
    s.style.animationDuration=(7+Math.random()*6)+'s';
    document.body.appendChild(s);
    setTimeout(function(){s.remove()},14000);
    if(++n>40) clearInterval(t);
  },700);
})();
</script>
</body>
</html>
